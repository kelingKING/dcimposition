<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ujian Olimpiade Matematika SD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e4;
    --paper-line:#e1d6ba;
    --ink:#1f2a37;
    --ink-soft:#5b6472;
    --navy:#1f3c5c;
    --navy-dark:#122740;
    --gold:#a9812f;
    --gold-soft:#e7d8ab;
    --red:#a4392f;
    --red-soft:#f1ddd6;
    --green:#3d6b4a;
    --green-soft:#dde9e0;
    --radius:14px;
    --shadow: 0 10px 30px -12px rgba(18,39,64,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #fffaf0 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Fraunces', Georgia, serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{max-width:920px;margin:0 auto;padding:22px 16px 80px;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Header stamp ---------- */
  .seal{
    display:flex;align-items:center;gap:14px;
    padding:18px 22px;
    background:var(--navy);
    color:#fdf9ee;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .seal::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle, rgba(233,207,139,0.18), transparent 70%);
  }
  .seal-badge{
    width:56px;height:56px;border-radius:50%;
    border:2px solid var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-family:'Fraunces',serif;font-weight:700;font-size:20px;
    color:var(--gold-soft);
    background:rgba(255,255,255,0.05);
  }
  .seal-title{font-size:20px;font-weight:600;line-height:1.25;margin:0;}
  .seal-sub{margin:2px 0 0;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:#cfe0f0;opacity:.85;}

  /* ---------- Cards ---------- */
  .card{
    background:#fffdf7;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px;
    margin-top:18px;
  }
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase;}
  .field input[type=text], .field input[type=password], .field textarea{
    width:100%;padding:12px 14px;border-radius:10px;
    border:1.5px solid var(--paper-line);background:#fffefb;
    font-size:15.5px;color:var(--ink);font-family:inherit;
  }
  .field input:focus, .field textarea:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 22px;border-radius:999px;border:none;
    font-weight:700;font-size:15px;letter-spacing:.01em;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--navy);color:#fdf9ee;box-shadow:0 8px 18px -8px rgba(31,60,92,0.55);}
  .btn-primary:hover{background:var(--navy-dark);}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-ghost:hover{background:rgba(31,60,92,0.06);}
  .btn-gold{background:var(--gold);color:#3a2c07;box-shadow:0 8px 18px -8px rgba(169,129,47,0.55);}
  .btn-danger{background:var(--red);color:#fff6f2;}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:999px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .link-btn{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:13.5px;padding:0;}

  /* ---------- Home ---------- */
  .home-hero{text-align:center;padding:6px 4px 2px;}
  .home-hero h1{font-size:clamp(24px,4.5vw,32px);margin:0 0 6px;color:var(--navy-dark);}
  .home-hero p{color:var(--ink-soft);font-size:14.5px;margin:0;}
  .setgrid{display:grid;grid-template-columns:repeat(5, 1fr);gap:8px;}
  @media (max-width:420px){.setgrid{grid-template-columns:repeat(5, 1fr);gap:6px;}}
  .setdot{
    aspect-ratio:1/1;border-radius:12px;
    border:2px solid var(--paper-line);background:#fffefb;
    font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--navy);
  }
  .setdot.selected{background:var(--navy);border-color:var(--navy);color:#fdf9ee;box-shadow:0 6px 14px -6px rgba(31,60,92,0.5);}
  .set-hint{font-size:12.5px;color:var(--ink-soft);margin:8px 2px 0;}

  .rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  @media (max-width:520px){.rules-grid{grid-template-columns:1fr;}}
  .rule-item{
    background:var(--gold-soft);
    border-radius:10px;padding:10px 12px;font-size:13px;color:#4a3a10;
    display:flex;justify-content:space-between;gap:8px;
  }
  .rule-item b{color:#2f2405;}

  /* ---------- Nav grid (bubble sheet) ---------- */
  .navgrid-wrap{
    position:sticky;top:10px;z-index:20;
    background:rgba(246,241,228,0.92);
    backdrop-filter:blur(6px);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-top:16px;
    box-shadow:var(--shadow);
  }
  .navgrid-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .timer{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:var(--red);background:var(--red-soft);padding:5px 12px;border-radius:999px;}
  .navgrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(30px,1fr));gap:6px;}
  .navdot{
    width:30px;height:30px;border-radius:50%;
    border:1.5px solid var(--paper-line);background:#fffefb;
    font-size:11.5px;font-weight:700;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .navdot.answered{background:var(--navy);border-color:var(--navy);color:#fff;}
  .navdot.essay{border-style:dashed;}

  /* ---------- Questions ---------- */
  .qsection-label{
    display:inline-block;background:var(--navy);color:#fdf9ee;
    font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:6px 14px;border-radius:999px;margin:22px 0 10px;
  }
  .qcard{scroll-margin-top:170px;}
  .qnum{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;
    background:var(--navy); color:#fff;font-weight:700;font-size:13.5px;
    flex-shrink:0;
  }
  .qhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;}
  .qtext{font-size:16px;line-height:1.55;padding-top:3px;}
  .options{display:grid;gap:10px;margin-left:42px;}
  .option{
    display:flex;align-items:center;gap:12px;
    border:1.5px solid var(--paper-line);border-radius:12px;
    padding:10px 14px;background:#fffefb;
  }
  .option:hover{border-color:var(--navy);}
  .bubble{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--navy);
    background:#fff;
  }
  .option.selected{background:var(--navy);border-color:var(--navy);color:#fdf9ee;}
  .option.selected .bubble{background:var(--gold);border-color:var(--gold);color:#3a2c07;}
  .option-text{font-size:15px;}
  .essay-points{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-left:42px;margin-top:-6px;margin-bottom:10px;}

  /* ---------- Result ---------- */
  .result-score{
    text-align:center;padding:22px 10px 6px;
  }
  .result-score .num{font-family:'Fraunces',serif;font-size:52px;font-weight:700;color:var(--navy-dark);}
  .result-score .lbl{color:var(--ink-soft);font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;}
  .code-box{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--gold-soft);border:1.5px dashed var(--gold);
    border-radius:12px;padding:14px;margin-top:14px;
  }
  .code-box .code{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;letter-spacing:.12em;color:#4a3a10;}

  /* ---------- Admin ---------- */
  .admin-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 4px;border-bottom:1px solid var(--paper-line);
    flex-wrap:wrap;
  }
  .admin-row:last-child{border-bottom:none;}
  .pill{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;}
  .pill.pending{background:var(--gold-soft);color:#4a3a10;}
  .pill.done{background:var(--green-soft);color:var(--green);}
  .score-input{width:64px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--paper-line);font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:center;}
  .essay-review{background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:8px;font-size:14px;line-height:1.5;white-space:pre-wrap;border:1px solid var(--paper-line);}
  .rubric-box{background:var(--green-soft);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:13px;color:#2c4a35;}
  table.mc-key{width:100%;border-collapse:collapse;font-size:13px;}
  table.mc-key td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--paper-line);}
  .banner{padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;}
  .banner.warn{background:var(--red-soft);color:var(--red);}
  .banner.ok{background:var(--green-soft);color:var(--green);}
  .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:30px 0;}
  footer.tip{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:26px;}

  /* ---------- Review / pembahasan ---------- */
  .review-item{border-radius:12px;border:1.5px solid var(--paper-line);padding:14px 16px;margin-top:12px;background:#fffefb;}
  .review-item.correct{border-color:var(--green);background:var(--green-soft);}
  .review-item.wrong{border-color:var(--red);background:var(--red-soft);}
  .review-item.blank{border-color:var(--gold);background:var(--gold-soft);}
  .review-top{display:flex;align-items:flex-start;gap:10px;}
  .review-badge{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#fff;
  }
  .review-badge.correct{background:var(--green);}
  .review-badge.wrong{background:var(--red);}
  .review-badge.blank{background:var(--gold);color:#3a2c07;}
  .review-q{font-size:14.5px;font-weight:600;line-height:1.4;}
  .review-ans{font-size:13.5px;margin:8px 0 0 36px;color:var(--ink-soft);}
  .review-ans b{color:var(--ink);}
  .review-explain{font-size:13.5px;margin:6px 0 0 36px;padding:8px 12px;background:rgba(255,255,255,0.6);border-radius:8px;line-height:1.5;}
  .review-summary{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px;}
  .review-chip{padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;}
  .review-chip.correct{background:var(--green-soft);color:var(--green);}
  .review-chip.wrong{background:var(--red-soft);color:var(--red);}
  .review-chip.blank{background:var(--gold-soft);color:#4a3a10;}
</style>
</head>

    adminMsg: "",
    showKey: false,
    keySet: "A"
  };

  var app = document.getElementById("app");

  function render(){ app.innerHTML = views[state.screen](); bindEvents(); }

  function el(sel){ return app.querySelector(sel); }
  function els(sel){ return Array.prototype.slice.call(app.querySelectorAll(sel)); }

  /* ============ STORAGE HELPERS ============ */
  function genId(){
    var chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    var out = "";
    for (var i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }

  function getIndex(){
    return window.storage.get("submission-index", true)
      .then(function(r){ return r ? JSON.parse(r.value) : []; })
      .catch(function(){ return []; });
  }

  function saveSubmission(sub){
    return getIndex().then(function(idx){
      idx.push(sub.id);
      return window.storage.set("submission-index", JSON.stringify(idx), true);
    }).then(function(){
      return window.storage.set("submission:" + sub.id, JSON.stringify(sub), true);
    });
  }

  function getSubmission(id){
    return window.storage.get("submission:" + id, true)
      .then(function(r){ return r ? JSON.parse(r.value) : null; })
      .catch(function(){ return null; });
  }

  function loadAllSubmissions(){
    state.adminLoading = true; render();
    return getIndex().then(function(idx){
      var uniq = idx.filter(function(v,i,a){ return a.indexOf(v)===i; });
      return Promise.all(uniq.map(function(id){ return getSubmission(id); }));
    }).then(function(list){
      state.submissions = list.filter(Boolean).sort(function(a,b){ return (b.submittedAt||0) - (a.submittedAt||0); });
      state.adminLoading = false;
      render();
    }).catch(function(){
      state.adminLoading = false; render();
    });
  }

  /* ============ SCORING ============ */
  function computeMcScore(mcAnswers, questions){
    var score = 0, answered = 0;
    questions.forEach(function(q, i){
      var a = mcAnswers[i];
      if (a === undefined || a === null){ return; }
      answered++;
      if (a === q[2]) score += 4; else score -= 1;
    });
    return { score: score, answered: answered };
  }

  /* ============ TIMER ============ */
  function fmtTime(sec){
    sec = Math.max(0, sec);
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }
  function startTimer(){
    if (state.timerId) return;
    state.timerId = setInterval(function(){
      state.timeLeft--;
      if (state.timeLeft <= 0){
        clearInterval(state.timerId);
        state.timerId = null;
        submitExam(true);
        return;
      }
      var t = el(".timer");
      if (t) t.textContent = "⏱ " + fmtTime(state.timeLeft);
    }, 1000);
  }

  /* ============ ACTIONS ============ */
  function goHome(){
    if (state.timerId){ clearInterval(state.timerId); state.timerId = null; }
    state.screen = "home"; render();
  }

  function escAttr(str){
    return String(str||"").replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  function selectSet(letter){
    state.selectedSet = letter;
    state.homeError = "";
    render();
  }

  function startExam(){
    var name = state.nameDraft || "";
    var kelas = state.kelasDraft || "";
    if (!state.selectedSet){
      state.homeError = "Pilih salah satu paket soal (A - J) terlebih dahulu.";
      render();
      return;
    }
    if (!name.trim() || !kelas.trim()){
      state.homeError = "Isi nama dan kelas terlebih dahulu.";
      render();
      return;
    }
    state.student = { name: name.trim(), kelas: kelas.trim() };
    state.currentMC = QUESTION_SETS[state.selectedSet];
    state.mcAnswers = {};
    state.timeLeft = TIME_LIMIT_SEC;
    state.examStarted = true;
    state.screen = "exam";
    render();
    startTimer();
  }

  function submitExam(auto){
    if (state.timerId){ clearInterval(state.timerId); state.timerId = null; }
    var unanswered = state.currentMC.length - Object.keys(state.mcAnswers).length;
    if (!auto && unanswered > 0){
      var ok = confirm("Masih ada " + unanswered + " soal pilihan ganda yang belum dijawab. Yakin ingin mengumpulkan jawaban sekarang?");
      if (!ok) { startTimer(); return; }
    }
    var mc = computeMcScore(state.mcAnswers, state.currentMC);
    var sub = {
      id: genId(),
      name: state.student.name,
      kelas: state.student.kelas,
      set: state.selectedSet,
      mcAnswers: state.mcAnswers,
      mcScore: mc.score,
      mcAnswered: mc.answered,
      totalScore: mc.score,
      submittedAt: Date.now(),
      autoSubmitted: !!auto
    };
    state.lastSubmission = sub;
    state.screen = "result";
    render();
    saveSubmission(sub).catch(function(){});
  }

    state.checkError = ""; state.checkResult = null;
    getSubmission(code).then(function(sub){
      if (!sub){ state.checkError = "Kode tidak ditemukan. Periksa kembali kode ujian Anda."; }
      else { state.checkResult = sub; }
      render();
    });
  }

  function tryAdminLogin(){
    var code = (el("#admin-code-input")||{}).value || "";
    if (code.trim().toLowerCase() === ADMIN_CODE){
      state.adminUnlocked = true;
      state.adminError = "";
      state.screen = "admin";
      render();
      loadAllSubmissions();
    } else {
      state.adminError = "Kode admin salah.";
      render();
    }
  }

  function clearAllData(){
    var ok = confirm("Hapus SEMUA data ujian yang tersimpan? Tindakan ini tidak dapat dibatalkan.");
    if (!ok) return;
    getIndex().then(function(idx){
      var jobs = idx.map(function(id){ return window.storage.delete("submission:" + id, true).catch(function(){}); });
      return Promise.all(jobs);
    }).then(function(){
      return window.storage.set("submission-index", JSON.stringify([]), true);
    }).then(function(){
      state.submissions = [];
      state.adminMsg = "Semua data ujian telah dihapus.";
      render();
    });
  }

  /* ============ VIEWS ============ */
  var views = {};

  views.home = function(){
    return ''
    + '<div class="seal">'
    +   '<div class="seal-badge">σ</div>'
    +   '<div><p class="seal-title">Ujian Olimpiade Matematika</p><p class="seal-sub">Sekolah Dasar &middot; Kelas 1&ndash;2</p></div>'
    + '</div>'
    + '<div class="card">'
    +   '<div class="home-hero"><h1>Selamat datang, Juara Kecil! 🎯</h1><p>Pilih paket soal, isi datamu, lalu tekan mulai.</p></div>'
    +   (state.homeError ? '<div class="banner warn">' + state.homeError + '</div>' : '')
    +   '<div class="field"><label>Pilih paket soal</label>'
    +     '<div class="setgrid">'
    +     SET_LETTERS.map(function(letter){
            var sel = state.selectedSet === letter;
            return '<button class="setdot ' + (sel?'selected':'') + '" data-set="' + letter + '">' + letter + '</button>';
          }).join('')
    +     '</div>'
    +     '<p class="set-hint">' + (state.selectedSet ? ('Paket ' + state.selectedSet + ' dipilih &middot; 30 soal pilihan ganda.') : 'Setiap paket berisi 30 soal berbeda dengan tingkat kesulitan yang setara.') + '</p>'
    +   '</div>'
    +   '<div class="field"><label>Nama lengkap</label><input type="text" id="in-name" value="' + escAttr(state.nameDraft) + '" placeholder="Contoh: Kirana Ayu"/></div>'
    +   '<div class="field"><label>Kelas</label><input type="text" id="in-kelas" value="' + escAttr(state.kelasDraft) + '" placeholder="Contoh: 2A"/></div>'
    +   '<div class="rules-grid">'
    +     '<div class="rule-item"><span>Benar</span><b>+4 poin</b></div>'
    +     '<div class="rule-item"><span>Salah</span><b>&minus;1 poin</b></div>'
    +     '<div class="rule-item"><span>Kosong</span><b>0 poin</b></div>'
    +     '<div class="rule-item"><span>Waktu</span><b>40 menit</b></div>'
    +   '</div>'
    +   '<div style="margin-top:20px;text-align:center;">'
    +     '<button class="btn btn-primary" id="btn-start">Mulai Ujian &rarr;</button>'
    +   '</div>'
    + '</div>'
    + '<div class="card" style="text-align:center;">'
    +   '<p style="margin:0 0 10px;font-size:14px;color:var(--ink-soft);">Sudah pernah mengumpulkan jawaban?</p>'
    +   '<button class="btn btn-ghost btn-sm" id="btn-check">Cek Status Nilai</button>'
    + '</div>'
    + '<footer class="tip">Halaman untuk guru/panitia &middot; <button class="link-btn" id="btn-admin">Masuk sebagai Admin</button></footer>';
  };

  views.check = function(){
    var r = state.checkResult;
    return ''
    + '<div class="seal"><div class="seal-badge">σ</div><div><p class="seal-title">Cek Status Nilai</p><p class="seal-sub">Masukkan kode ujian kamu</p></div></div>'
    + '<div class="card">'
    +   '<div class="field"><label>Kode ujian (6 karakter)</label><input type="text" id="check-code-input" class="mono" style="text-transform:uppercase;letter-spacing:.08em;" placeholder="Contoh: A1B2C3" maxlength="8"/></div>'
    +   (state.checkError ? '<div class="banner warn">' + state.checkError + '</div>' : '')
    +   '<div style="text-align:center;"><button class="btn btn-primary" id="btn-do-check">Cek Sekarang</button></div>'
    +   (r ? renderCheckResult(r) : '')
    + '</div>'
    + '<div style="text-align:center;margin-top:14px;"><button class="link-btn" id="btn-back-home">&larr; Kembali ke beranda</button></div>';
  };

  function renderCheckResult(r){
    var statusHtml = '<div class="result-score"><div class="lbl">Nilai Akhir</div><div class="num">' + r.totalScore + '</div><div class="lbl">dari ' + MAX_MC + '</div></div>';
    return '<div style="margin-top:16px;border-top:1px dashed var(--paper-line);padding-top:14px;">'
      + '<p style="margin:0 0 4px;font-weight:700;">' + r.name + ' &middot; Kelas ' + r.kelas + '</p>'
      + statusHtml
      + renderReview(r)
      + '</div>';
  }

  function renderReview(sub){
    var letters = ["A","B","C","D"];
    var qs = QUESTION_SETS[sub.set] || [];
    var nCorrect=0, nWrong=0, nBlank=0;
    var items = qs.map(function(q, i){
      var qtext=q[0], opts=q[1], correctIdx=q[2], explain=q[3];
      var given = sub.mcAnswers[i];
      var status = (given===undefined) ? "blank" : (given===correctIdx ? "correct" : "wrong");
      if (status==="correct") nCorrect++; else if (status==="wrong") nWrong++; else nBlank++;
      var badgeChar = status==="correct" ? "✓" : (status==="wrong" ? "✕" : "?");
      var yourAnsText = (given===undefined) ? "Tidak dijawab" : (letters[given] + ". " + opts[given]);
      var extra = status==="wrong"
        ? '<div class="review-ans">Jawaban benar: <b>' + letters[correctIdx] + '. ' + opts[correctIdx] + '</b></div>'
        : (status==="blank" ? '<div class="review-ans">Jawaban benar: <b>' + letters[correctIdx] + '. ' + opts[correctIdx] + '</b></div>' : '');
      return '<div class="review-item ' + status + '">'
        + '<div class="review-top"><span class="review-badge ' + status + '">' + badgeChar + '</span>'
        + '<span class="review-q">' + (i+1) + '. ' + qtext + '</span></div>'
        + '<div class="review-ans">Jawabanmu: <b>' + yourAnsText + '</b></div>'
        + extra
        + '<div class="review-explain">💡 ' + explain + '</div>'
      + '</div>';
    }).join('');

    return '<div style="margin-top:10px;">'
      + '<div class="review-summary">'
      +   '<span class="review-chip correct">Benar: ' + nCorrect + '</span>'
      +   '<span class="review-chip wrong">Salah: ' + nWrong + '</span>'
      +   '<span class="review-chip blank">Kosong: ' + nBlank + '</span>'
      + '</div>'
      + '<div class="qsection-label" style="margin-top:18px;">Pembahasan Soal</div>'
      + items
      + '</div>';
  }

  views.exam = function(){
    var qs = state.currentMC;
    var answeredMc = Object.keys(state.mcAnswers).length;
    var html = '';
    html += '<div class="navgrid-wrap">'
      + '<div class="navgrid-top">'
      +   '<div><b>' + state.student.name + '</b> <span style="color:var(--ink-soft);font-size:13px;">&middot; Kelas ' + state.student.kelas + ' &middot; Paket ' + state.selectedSet + '</span></div>'
      +   '<div class="timer">⏱ ' + fmtTime(state.timeLeft) + '</div>'
      + '</div>'
      + '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;">Terjawab: ' + answeredMc + ' / ' + qs.length + ' pilihan ganda</div>'
      + '<div class="navgrid">'
      + qs.map(function(_, i){
          var done = state.mcAnswers[i] !== undefined;
          return '<button class="navdot ' + (done?'answered':'') + '" data-jump="mc-' + i + '">' + (i+1) + '</button>';
        }).join('')
      + '</div>'
    + '</div>';

    html += '<div class="qsection-label">Soal Pilihan Ganda &middot; Paket ' + state.selectedSet + '</div>';
    qs.forEach(function(q, i){
      var qtext = q[0], opts = q[1];
      html += '<div class="card qcard" id="mc-' + i + '">'
        + '<div class="qhead"><span class="qnum">' + (i+1) + '</span><span class="qtext">' + qtext + '</span></div>'
        + '<div class="options">'
        + opts.map(function(opt, oi){
            var sel = state.mcAnswers[i] === oi;
            var letters = ["A","B","C","D"];
            return '<button class="option ' + (sel?'selected':'') + '" data-mc="' + i + '" data-opt="' + oi + '">'
              + '<span class="bubble">' + letters[oi] + '</span><span class="option-text">' + opt + '</span></button>';
          }).join('')
        + '</div>'
      + '</div>';
    });

    html += '<div class="card" style="text-align:center;">'
      + '<p style="color:var(--ink-soft);font-size:13.5px;margin-top:0;">Periksa kembali jawabanmu sebelum mengumpulkan. Jangan memuat ulang (refresh) halaman selama ujian berlangsung.</p>'
      + '<button class="btn btn-primary" id="btn-submit">Kumpulkan Jawaban</button>'
      + '</div>';

    return html;
  };

  views.result = function(){
    var s = state.lastSubmission;
    if (!s) return views.home();
    return ''
    + '<div class="seal"><div class="seal-badge">✓</div><div><p class="seal-title">Jawaban Terkumpul</p><p class="seal-sub">Terima kasih, ' + s.name + '!</p></div></div>'
    + '<div class="card">'
    +   (s.autoSubmitted ? '<div class="banner warn">Waktu habis &mdash; jawabanmu dikumpulkan secara otomatis.</div>' : '')
    +   '<div class="result-score"><div class="num">' + s.totalScore + '</div><div class="lbl">Nilai Akhir (dari ' + MAX_MC + ')</div></div>'
    +   '<div class="code-box"><span>🔑</span><span class="code">' + s.id + '</span></div>'
    +   '<p style="text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:8px;">Simpan kode ini untuk mengecek ulang nilaimu kapan saja.</p>'
    +   renderReview(s)
    +   '<div style="text-align:center;margin-top:20px;"><button class="btn btn-ghost" id="btn-home2">Kembali ke Beranda</button></div>'
    + '</div>';
  };

  views["admin-login"] = function(){
    return ''
    + '<div class="seal"><div class="seal-badge">🔒</div><div><p class="seal-title">Akses Admin</p><p class="seal-sub">Masukkan kode admin untuk menilai ujian</p></div></div>'
    + '<div class="card">'
    +   '<div class="field"><label>Kode admin</label><input type="password" id="admin-code-input" placeholder="Masukkan kode akses"/></div>'
    +   (state.adminError ? '<div class="banner warn">' + state.adminError + '</div>' : '')
    +   '<div style="text-align:center;"><button class="btn btn-primary" id="btn-admin-login">Masuk</button></div>'
    + '</div>'
    + '<div style="text-align:center;margin-top:14px;"><button class="link-btn" id="btn-back-home2">&larr; Kembali ke beranda</button></div>';
  };

  views.admin = function(){
    var subs = state.submissions;
    var avg = subs.length ? Math.round(subs.reduce(function(a,s){return a+s.totalScore;},0) / subs.length) : 0;
    var html = '<div class="seal"><div class="seal-badge">🗂</div><div><p class="seal-title">Panel Nilai</p><p class="seal-sub">' + subs.length + ' peserta &middot; rata-rata nilai ' + avg + '</p></div></div>';

    html += '<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">'
      + '<button class="btn btn-ghost btn-sm" id="btn-refresh">↻ Muat Ulang Data</button>'
      + '<div style="display:flex;gap:8px;">'
      + '<button class="btn btn-ghost btn-sm" id="btn-show-key">Lihat Kunci PG</button>'
      + '<button class="btn btn-danger btn-sm" id="btn-clear-all">Hapus Semua Data</button>'
      + '</div>'
      + '</div>';

    if (state.adminMsg){
      html += '<div class="banner ok">' + state.adminMsg + '</div>';
    }

    if (state.showKey){
      html += '<div class="card">'
        + '<h3 style="margin-top:0;">Kunci Jawaban Pilihan Ganda</h3>'
        + '<div class="setgrid" style="grid-template-columns:repeat(10,1fr);max-width:480px;margin-bottom:14px;">'
        + SET_LETTERS.map(function(letter){
            var sel = state.keySet === letter;
            return '<button class="setdot ' + (sel?'selected':'') + '" data-keyset="' + letter + '" style="font-size:14px;">' + letter + '</button>';
          }).join('')
        + '</div>'
        + '<table class="mc-key">' + mcKeyRows(state.keySet) + '</table>'
        + '</div>';
    }

    if (state.adminLoading){
      html += '<div class="card"><p class="empty">Memuat data peserta...</p></div>';
    } else if (subs.length === 0){
      html += '<div class="card"><p class="empty">Belum ada peserta yang mengumpulkan jawaban.</p></div>';
    } else {
      html += '<div class="card">';
      subs.forEach(function(s){
        html += renderAdminRow(s);
      });
      html += '</div>';
    }

    html += '<div style="text-align:center;margin-top:14px;"><button class="link-btn" id="btn-back-home3">&larr; Kembali ke beranda</button></div>';
    return html;
  };

  function mcKeyRows(setLetter){
    var letters = ["A","B","C","D"];
    var qs = QUESTION_SETS[setLetter] || [];
    var rows = "";
    for (var i=0;i<qs.length;i+=5){
      rows += "<tr>";
      for (var j=i;j<Math.min(i+5, qs.length);j++){
        rows += "<td><b>" + (j+1) + "</b>. " + letters[qs[j][2]] + "</td>";
      }
      rows += "</tr>";
    }
    return rows;
  }

  function renderAdminRow(s){
    var expanded = state.adminExpanded === s.id;
    var pill = '<span class="pill done">Nilai: ' + s.totalScore + '</span>';
    var head = '<div class="admin-row">'
      + '<div><b>' + s.name + '</b> <span style="color:var(--ink-soft);font-size:13px;">&middot; Kelas ' + s.kelas + ' &middot; Paket ' + s.set + '</span></div>'
      + '<div style="display:flex;align-items:center;gap:8px;">' + pill + '<button class="btn btn-ghost btn-sm" data-expand="' + s.id + '">' + (expanded?'Tutup':'Lihat Pembahasan') + '</button></div>'
      + '</div>';

    if (!expanded) return head;

    var body = '<div style="padding:6px 4px 18px;">' + renderReview(s) + '</div>';
    return head + body;
  }

  /* ============ EVENT BINDING ============ */
  function bindEvents(){
    var b;
    if (b = el("#btn-start")) b.onclick = startExam;
    var nameInput = el("#in-name");
    if (nameInput) nameInput.oninput = function(){ state.nameDraft = nameInput.value; };
    var kelasInput = el("#in-kelas");
    if (kelasInput) kelasInput.oninput = function(){ state.kelasDraft = kelasInput.value; };
    els("[data-set]").forEach(function(btn){
      btn.onclick = function(){ selectSet(btn.getAttribute("data-set")); };
    });
    if (b = el("#btn-check")) b.onclick = function(){ state.screen="check"; state.checkResult=null; state.checkError=""; render(); };
    if (b = el("#btn-admin")) b.onclick = function(){ state.screen="admin-login"; render(); };
    if (b = el("#btn-back-home")) b.onclick = goHome;
    if (b = el("#btn-back-home2")) b.onclick = goHome;
    if (b = el("#btn-back-home3")) b.onclick = goHome;
    if (b = el("#btn-home2")) b.onclick = goHome;
    if (b = el("#btn-do-check")) b.onclick = checkStatus;
    if (b = el("#btn-admin-login")) b.onclick = tryAdminLogin;
    if (b = el("#btn-submit")) b.onclick = function(){ submitExam(false); };
    if (b = el("#btn-refresh")) b.onclick = loadAllSubmissions;
    if (b = el("#btn-clear-all")) b.onclick = clearAllData;
    if (b = el("#btn-show-key")) b.onclick = function(){ state.showKey = !state.showKey; render(); };
    els("[data-keyset]").forEach(function(btn){
      btn.onclick = function(){ state.keySet = btn.getAttribute("data-keyset"); render(); };
    });

    els(".option").forEach(function(o){
      o.onclick = function(){
        var i = parseInt(o.getAttribute("data-mc"), 10);
        var oi = parseInt(o.getAttribute("data-opt"), 10);
        if (state.mcAnswers[i] === oi){ delete state.mcAnswers[i]; }
        else { state.mcAnswers[i] = oi; }
        render();
        var target = el("#mc-" + i);
        if (target && target.scrollIntoView) target.scrollIntoView({ block: "center", behavior: "instant" in window ? "instant" : "auto" });
      };
    });

    els("[data-jump]").forEach(function(btn){
      btn.onclick = function(){
        var target = el("#" + btn.getAttribute("data-jump"));
        if (target && target.scrollIntoView) target.scrollIntoView({ block: "start", behavior: "smooth" });
      };
    });

    els("[data-expand]").forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-expand");
        state.adminExpanded = state.adminExpanded === id ? null : id;
        state.adminMsg = "";
        render();
      };
    });

    var enterHandlers = [
      ["#in-kelas", startExam],
      ["#check-code-input", checkStatus],
      ["#admin-code-input", tryAdminLogin]
    ];
    enterHandlers.forEach(function(pair){
      var input = el(pair[0]);
      if (input){
        input.onkeydown = function(ev){ if (ev.key === "Enter"){ pair[1](); } };
      }
    });
  }

  render();
})();
</script>
</body>
</html>
